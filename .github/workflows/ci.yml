name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: tests
        run: go test ./... -timeout 60s -cover

      - name: shell syntax
        run: |
          bash -n install.sh
          bash -n update.sh
          bash -n uninstall.sh
          bash -n scripts/verify_oversell_evidence.sh
